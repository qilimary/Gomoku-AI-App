name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Generate complete project from the second upload file
        run: python3 build_project.py --output generated-app
      - name: AI regression tests
        working-directory: generated-app
        run: bash scripts/test_ai.sh
      - name: Build and lint
        working-directory: generated-app
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:lintDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Board-Games-v1.10.0
          path: generated-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
